    <ellipse cx="669" cy="145" rx="321" ry="166" fill="url(#light)"/>
    <g fill="none" stroke="#8ea6ff" opacity=".15">
      <circle cx="680" cy="119" r="116"/><circle cx="680" cy="119" r="142"/><circle cx="680" cy="119" r="169"/>
      <path d="M487 119h393M680 0v230" stroke-dasharray="3 7"/>
