<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" role="img" aria-labelledby="title desc">
  <title id="title">iRing for macOS</title>
  <desc id="desc">iRing's wordmark beside an illustration of its pointer-centered ring and edge dock.</desc>
  <defs>
    <linearGradient id="bg" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
      <stop stop-color="#091121"/><stop offset="1" stop-color="#212746"/>
    </linearGradient>
    <radialGradient id="light"><stop stop-color="#6c7dff" stop-opacity=".48"/><stop offset="1" stop-color="#6c7dff" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x2="0%" y2="100%"><stop stop-color="#6b84ce" stop-opacity=".42"/><stop offset="1" stop-color="#1e2a4f" stop-opacity=".9"/></linearGradient>
    <linearGradient id="edge" x2="100%" y2="100%"><stop stop-color="#aebdff" stop-opacity=".58"/><stop offset="1" stop-color="#8c9eff" stop-opacity=".12"/></linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="878" height="228" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
