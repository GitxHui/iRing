    <rect x="57" y="78" width="58" height="58" rx="17" fill="url(#glass)" stroke="url(#edge)"/>
    <path d="M79 115a12 12 0 1 1 14 0" fill="none" stroke="#eef3ff" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M81 94a12 12 0 0 1 10 0" fill="none" stroke="#6aa8ff" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="86" cy="113" r="3" fill="#6aa8ff"/><path d="M86 119v4" stroke="#eef3ff" stroke-width="3.8" stroke-linecap="round"/>
    <text x="137" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="64" letter-spacing="-2" fill="#f4f7ff">iRing</text>
    <text x="141" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" font-size="17" letter-spacing="1.2" fill="#a7b8ea">for macOS</text>
    <rect x="561" y="32" width="119" height="31" rx="15.5" fill="url(#glass)" stroke="url(#edge)"/>
